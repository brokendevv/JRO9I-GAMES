<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#111C38"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="nebula" cx="72%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#EF4444" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#nebula)"/>
  <g fill="#F8FAFC" fill-opacity="0.55">
    <circle cx="88" cy="74" r="1.5"/><circle cx="164" cy="142" r="2"/><circle cx="520" cy="68" r="1.5"/>
    <circle cx="580" cy="210" r="2.2"/><circle cx="110" cy="290" r="1.8"/><circle cx="440" cy="330" r="1.4"/>
    <circle cx="290" cy="64" r="2.5"/><circle cx="72" cy="402" r="1.5"/>
  </g>
  <!-- Asteroid cluster -->
  <polygon points="460,110 515,92 548,132 528,184 472,190 442,148" fill="#1E293B" stroke="#475569" stroke-width="3"/>
  <polygon points="120,175 162,158 184,195 156,228 112,214" fill="#1E293B" stroke="#475569" stroke-width="2.5"/>
  <polygon points="495,280 546,265 572,306 540,342 490,326" fill="#0F172A" stroke="#334155" stroke-width="2.5"/>
  <!-- Thruster plume -->
  <g transform="translate(295, 248) rotate(-28)">
    <polygon points="-115,0 -35,-18 -35,18" fill="#F59E0B" fill-opacity="0.85"/>
    <polygon points="-80,0 -35,-9 -35,9" fill="#FEF3C7"/>
    <!-- Starfighter hull -->
    <polygon points="95,0 -38,-48 -18,0 -38,48" fill="url(#hull)" stroke="#F59E0B" stroke-width="2.5"/>
    <polygon points="45,0 -12,-14 -4,0 -12,14" fill="#0EA5E9"/>
    <!-- Laser bolts -->
    <rect x="115" y="-18" width="54" height="4" rx="2" fill="#F59E0B"/>
    <rect x="135" y="14" width="54" height="4" rx="2" fill="#F59E0B"/>
  </g>
</svg>
