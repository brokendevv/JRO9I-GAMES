      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="65%" stop-color="#31102F"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="55%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>
  </defs>
  <rect width="640" height="270" fill="url(#sky)"/>
  <circle cx="320" cy="245" r="88" fill="#F59E0B" fill-opacity="0.85"/>
  <rect width="640" y="265" height="215" fill="url(#ground)"/>
  <!-- Perspective 3D Grid Lines -->
  <g stroke="#F97316" stroke-opacity="0.45" stroke-width="2">
