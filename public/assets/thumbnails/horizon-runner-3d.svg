    <line x1="320" y1="265" x2="60" y2="480"/>
    <line x1="320" y1="265" x2="200" y2="480"/>
    <line x1="320" y1="265" x2="320" y2="480"/>
    <line x1="320" y1="265" x2="440" y2="480"/>
    <line x1="320" y1="265" x2="580" y2="480"/>
    <line x1="320" y1="265" x2="760" y2="480"/>
    <line x1="0" y1="295" x2="640" y2="295"/>
    <line x1="0" y1="335" x2="640" y2="335"/>
    <line x1="0" y1="390" x2="640" y2="390"/>
    <line x1="0" y1="455" x2="640" y2="455"/>
