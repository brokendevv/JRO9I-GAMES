<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#core)"/>
  <!-- Isometric Tactical Board -->
  <g transform="translate(170, 90)">
    <rect x="0" y="0" width="300" height="300" rx="18" fill="#0B1120" stroke="#334155" stroke-width="3"/>
    <!-- 4x4 Grid Cells -->
    <rect x="18" y="18" width="60" height="60" rx="8" fill="#1E293B"/>
    <rect x="86" y="18" width="60" height="60" rx="8" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
    <rect x="154" y="18" width="60" height="60" rx="8" fill="#1E293B"/>
    <rect x="222" y="18" width="60" height="60" rx="8" fill="#1E293B"/>

    <rect x="18" y="86" width="60" height="60" rx="8" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
    <rect x="86" y="86" width="60" height="60" rx="8" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
    <rect x="154" y="86" width="60" height="60" rx="8" fill="#D97706" stroke="#FBBF24" stroke-width="2"/>
    <rect x="222" y="86" width="60" height="60" rx="8" fill="#1E293B"/>

    <rect x="18" y="154" width="60" height="60" rx="8" fill="#1E293B"/>
    <rect x="86" y="154" width="60" height="60" rx="8" fill="#D97706" stroke="#FBBF24" stroke-width="2"/>
    <rect x="154" y="154" width="60" height="60" rx="8" fill="#D97706" stroke="#FBBF24" stroke-width="2"/>
    <rect x="222" y="154" width="60" height="60" rx="8" fill="#059669" stroke="#34D399" stroke-width="2"/>

    <rect x="18" y="222" width="60" height="60" rx="8" fill="#1E293B"/>
    <rect x="86" y="222" width="60" height="60" rx="8" fill="#1E293B"/>
    <rect x="154" y="222" width="60" height="60" rx="8" fill="#059669" stroke="#34D399" stroke-width="2"/>
    <rect x="222" y="222" width="60" height="60" rx="8" fill="#059669" stroke="#34D399" stroke-width="2"/>
  </g>
</svg>
