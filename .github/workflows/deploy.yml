name: Validate & Deploy JRO9I Games to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Least-privilege permissions required for official GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    env:
      # Automatically configures Vite base path for project pages (/repo-name/)
      # Change to "/" if using a custom root domain (e.g., games.jro9i.com)
      GITHUB_PAGES_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit & security tests
        run: npm test

      - name: Validate game bundles, paths, and catalog manifest
        run: npm run validate:games

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static portal for GitHub Pages
        run: npm run build

      - name: Verify zero secrets or tokens in dist bundle
        run: |
          if grep -R -E "(ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{35,}|AIza[0-9A-Za-z\-_]{35})" dist/; then
            echo "::error::Secret token pattern detected in public build output!"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
