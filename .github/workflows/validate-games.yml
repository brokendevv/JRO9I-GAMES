name: Validate Game Bundles & Catalog

on:
  pull_request:
    branches:
      - main
  push:
    paths:
      - "public/games/**"
      - "public/data/games.json"
      - "src/lib/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Validate all games and catalog metadata
        run: npm run validate:games
